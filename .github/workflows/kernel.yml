name: Build Samsung M30 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-latest

    steps:
    - name: 📦 Checkout Kernel Source
      uses: actions/checkout@v4

    - name: ⚙️ Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential curl flex git \
        libssl-dev libncurses5-dev libncursesw5-dev libelf-dev \
        ccache python3 unzip

    - name: 🛠️ Download Proton Clang
      run: |
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: 🔨 Build Kernel with Clang
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_PATH=$(pwd)/clang
        export PATH=$CLANG_PATH/bin:$PATH
        export ANDROID_MAJOR_VERSION=r

        make m30lte_defconfig
        make -j$(nproc) \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=$CLANG_PATH/bin/aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=$CLANG_PATH/bin/arm-linux-gnueabi-

    - name: 📤 Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz
        path: arch/arm64/boot/Image.gz
