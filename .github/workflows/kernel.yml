name: Compile Kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
    - name: 🧾 Checkout Kernel Source
      uses: actions/checkout@v4

    - name: 📦 Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y bc curl git build-essential \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          binutils-aarch64-linux-gnu

    - name: 🛠️ Download AOSP Clang (r383902)
      run: |
        mkdir clang && cd clang
        curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r17/clang-r383902.tar.gz
        tar -xf clang-r383902.tar.gz
        cd ..

    - name: 🧰 Compile Kernel
      run: |
        export PATH=$PWD/clang/bin:$PATH
        export ARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=$PWD/clang/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$PWD/clang/bin/arm-linux-androideabi-

        make O=out m30lte_defconfig
        make -j$(nproc) O=out CC=clang \
          CLANG_TRIPLE=$CLANG_TRIPLE \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32

    - name: 📦 Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image
        path: out/arch/arm64/boot/Image.gz
